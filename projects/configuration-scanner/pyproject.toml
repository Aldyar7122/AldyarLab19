[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab19-configuration-scanner"
version = "1.0.0"
description = "SCM practical assignment 3"
requires-python = ">=3.11"

[project.scripts]
configuration-scanner = "application.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E402", "F401", "I001"]
